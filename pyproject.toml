[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pipecat-session-continuity"
version = "0.2.0"
description = "A session continuity and context recovery library for Pipecat voice agents."
readme = "pipecat_session_continuity/README.md"
requires-python = ">=3.11"
dependencies = [
    "redis>=4.0.0",
    "pipecat-ai>=1.5.0",
]

[tool.setuptools]
packages = ["pipecat_session_continuity"]
include-package-data = false
